<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <title>Randevu Al</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        input, select, textarea {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            margin-bottom: 15px;
            border: 1px solid #ced4da;
            border-radius: 8px;
        }
        input:focus, select:focus, textarea:focus {
            border-color: #0d6efd;
            box-shadow: 0 0 5px rgba(13, 110, 253, 0.5);
            outline: none;
        }
    </style>
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow p-4 border-0">
                    <h3 class="text-primary mb-4">📅 Yeni Randevu Al</h3>
                    <form method="POST">
                        {% csrf_token %}
                        {{ form.as_p }}
                        <button type="submit" class="btn btn-primary w-100 fw-bold mt-2">Təsdiqlə və Göndər</button>
                    </form>
                    <a href="{% url 'patient_dashboard' %}" class="btn btn-outline-secondary w-100 mt-3">Geri Qayıt</a>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        document.querySelectorAll('input, select, textarea').forEach(el => {
            el.classList.add('form-control');
        });
    </script>
</body>
</html>
