<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <title>Şifrəni Dəyiş - Tibbi Sistem</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 400px; }
        h2 { color: #2c3e50; text-align: center; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #333; }
        input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
        .submit-btn { width: 100%; background-color: #2ecc71; color: white; border: none; padding: 10px; border-radius: 4px; font-size: 16px; cursor: pointer; }
        .submit-btn:hover { background-color: #27ae60; }
        .back-link { display: block; text-align: center; margin-top: 15px; color: #3498db; text-decoration: none; }
    </style>
</head>
<body>
    <div class="card">
        <h2>🔐 Şifrəni Yenilə</h2>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="submit-btn">Şifrəni Təsdiq Et</button>
        </form>
        <a href="{% url 'dashboard' %}" class="back-link">⬅ Panelə qayıt</a>
    </div>
</body>
</html>
