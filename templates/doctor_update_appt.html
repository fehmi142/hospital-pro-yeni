<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <title>Randevuya Cavab Yaz - Hospital Pro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow p-4 border-0">
                    <h3 class="text-success mb-3">📝 Xəstə: {{ appointment.patient.username }}</h3>
                    <p class="text-muted"><strong>Şikayəti:</strong> {{ appointment.notes|default:"Qeyd edilməyib" }}</p>
                    <hr>
                    
                    <!-- enctype="multipart/form-data" fayl yükləmək üçün mütləqdir! -->
                    <form method="POST" enctype="multipart/form-data">
                        {% csrf_token %}
                        
                        <div class="mb-3">
                            <label class="fw-bold">Statusu dəyiş:</label>
                            {{ form.status }}
                        </div>
                        
                        <div class="mb-3">
                            <label class="fw-bold text-primary">Resept və Rəyiniz:</label>
                            {{ form.prescription }}
                        </div>
                        
                        <div class="mb-3">
                            <label class="fw-bold text-danger">Rentgen / Fayl əlavə et:</label>
                            {{ form.attachment }}
                        </div>

                        <button type="submit" class="btn btn-success w-100 fw-bold mt-3">Yadda Saxla və Xəstəyə Göndər</button>
                    </form>
                    <a href="{% url 'doctor_dashboard' %}" class="btn btn-outline-secondary w-100 mt-2">Geri Qayıt</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
